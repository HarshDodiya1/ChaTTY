name: Release

# Push a tag like v2.1.0 to build binaries, publish a GitHub release and
# update the Homebrew tap. Tags with a suffix (v2.1.0-rc.1) become pre-releases
# and skip Homebrew.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  TAP_REPO: HarshDodiya1/homebrew-tap

jobs:
  build:
    name: Build ${{ matrix.targets }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Built on macOS so the binaries get an ad-hoc code signature.
          - os: macos-latest
            targets: darwin-arm64 darwin-x64
          - os: ubuntu-latest
            targets: linux-x64 linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Compile
        run: bun scripts/build.ts --version "${GITHUB_REF_NAME}" ${{ matrix.targets }}
      - name: Smoke test native binary
        shell: bash
        run: |
          target="$(uname -s | tr '[:upper:]' '[:lower:]')-$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')"
          test "$(./dist/$target/chatty --version)" = "${GITHUB_REF_NAME#v}"
          bun scripts/smoke.ts "dist/$target/chatty"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
          cat dist/*.sha256 > dist/checksums.txt
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "ChaTTY $GITHUB_REF_NAME" --generate-notes --verify-tag $prerelease

  homebrew:
    name: Update Homebrew tap
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the HOMEBREW_TAP_TOKEN secret (a token with contents:write on $TAP_REPO)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula and push
        run: |
          mkdir -p tap/Formula
          bun scripts/formula.ts --version "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > tap/Formula/chatty.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/chatty.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "chatty ${GITHUB_REF_NAME#v}"
          git push

  verify-brew:
    name: brew install (${{ matrix.os }})
    needs: homebrew
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: Homebrew/actions/setup-homebrew@master
      - run: brew install "${TAP_REPO%/homebrew-tap}/tap/chatty"
      - run: brew test chatty
      - run: test "$(chatty --version)" = "${GITHUB_REF_NAME#v}"
